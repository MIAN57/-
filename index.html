<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>秋辞脚本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.2), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.2), transparent 40%);
            color: #fff;
            padding: 20px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(90deg, #7b61ff, #00d4ff, #ff61d8);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 3s linear infinite;
            text-shadow: 0 0 20px rgba(123, 97, 255, 0.5);
            margin-bottom: 40px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .text-box {
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(120, 180, 255, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.2);
            transition: all 0.3s ease;
            margin-bottom: 35px;
        }

        .content-text {
            font-size: 17px;
            line-height: 1.8;
            color: #e8f0ff;
            word-break: break-all;
        }

        .copy-btn {
            padding: 14px 45px;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(135deg, #6c5ce7, #00b8ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .tip {
            margin-top: 15px;
            font-size: 14px;
            color: #88aaff;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <h1 class="title">秋辞脚本</h1>

    <div class="text-box">
        <p class="content-text" id="copyContent">
loadstring(game:HttpGet("https://raw.githubusercontent.com/fningna51-stack/-/main/%E7%A7%8B%E8%BE%9E%E7%BC%9D%E5%90%88%E8%84%9A%E6%9C%AC%E6%9C%80%E6%96%B0%E7%89%88%E6%96%B0ui"))()
        </p>
    </div>

    <button class="copy-btn" id="copyBtn">一键复制</button>
    <div class="tip" id="tipText">✅ 已复制到剪贴板</div>

    <script>
        const copyBtn = document.getElementById('copyBtn');
        const tipText = document.getElementById('tipText');
        const text = document.getElementById('copyContent').innerText;

        copyBtn.addEventListener('click', function() {
            // 优先使用标准剪贴板API（手机主流浏览器支持）
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showTip();
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                // 低版本浏览器/微信等环境 兼容方案
                fallbackCopy();
            }
        });

        // 兼容复制方案
        function fallbackCopy() {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showTip();
        }

        // 显示提示
        function showTip() {
            tipText.style.opacity = '1';
            setTimeout(() => {
                tipText.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
